<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Full Stack App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>My First Full Stack App 🚀 -Git practice</h1>

        <h2>Add User</h2>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
        >

        <button onclick="addUser()">
            Add User
        </button>

        <p id="result"></p>

        <hr>

        <h2>Users</h2>

        <button onclick="getUsers()">
            Get Users
        </button>

        <ul id="userList"></ul>

    </div>

    <script src="script.js"></script>

</body>

</html>
